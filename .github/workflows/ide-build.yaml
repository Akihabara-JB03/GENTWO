name: GENTWO IDE BUILD

on:
  push:
jobs:
  linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/IDE
    steps:
      - uses: actions/checkout@v4
      - name: Linuxビルド依存関係のインストール
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libstdc++-12-dev
      - name: Flutter SDKのセットアップ
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: 依存関係設定
        run: flutter pub get
      - name: コード問題発見
        run: flutter analyze
      - name: GENTWO IDEのLinux用ビルド
        run: flutter build linux
      - name: 成果物アップロード
        uses: actions/upload-artifact@v4
        with:
          name: gentwo-ide-linux
          path: src/IDE/build/linux/x64/release/bundle/
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: src/IDE
    steps:
      - uses: actions/checkout@v4
      - name: Flutter SDKのセットアップ
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: 依存関係設定
        run: flutter pub get
      - name: コード問題発見
        run: flutter analyze
      - name: GENTWO IDEのWindows用ビルド
        run: flutter build windows
      - name: 成果物アップロード
        uses: actions/upload-artifact@v4
        with:
          name: gentwo-ide-windows
          path: src/IDE/build/windows/x64/release/bundle/