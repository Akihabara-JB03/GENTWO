            <p>
                本言語のチュートリアルへようこそ。どうぞ、足をお楽にしてお聞きください。
                突然ですが、この言語が目指しているものをご存知でしょうか。
                ご存知でない方のために簡単にご説明しますと、GENTWOは「英語が読めれば書ける言語」を目指して開発されています。

                ですが、この言語にずっと留めさせるわけでもありませんし、それは目的ではありません。
                この言語はどの言語も触ったことがない人に対して、プログラミングの考え方をわかりやすく書け、別の言語をいじれる踏み台になるのが目的であり、
